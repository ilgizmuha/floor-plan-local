<div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Разделы">
      <div class="sidebar-brand">
        Сделки CRM
        <small>личный кабинет</small>
      </div>
      <div class="nav-section">Сделки</div>
      <button type="button" class="nav-item is-active" id="navDealsList">Все сделки</button>
      <div class="nav-section">Договоры</div>
      <a class="nav-item" id="navToContracts" href="CONTRACTS_URL_PLACEHOLDER">Генерация договора (форма)</a>
      <div class="nav-section">Подсказка</div>
      <p style="padding:8px 16px;font-size:11px;line-height:1.45;color:rgba(255,255,255,0.45)">
        Откройте сделку — договор, продавцы, покупатели, объект и параметры редактируются отдельными кнопками.
      </p>
    </aside>

    <div class="backdrop" id="backdrop" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Меню">☰</button>
        <div class="topbar-search">
          <input type="search" id="globalSearch" placeholder="Поиск по кабинету…" autocomplete="off" />
        </div>
        <div class="topbar-actions" style="gap:10px">
          <span id="yvoDealBuildTag" style="font-size:12px;color:rgba(255,255,255,0.7)"></span>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" title="Сообщения" aria-label="Сообщения">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
          </button>
          <button type="button" class="icon-btn" title="Уведомления" aria-label="Уведомления">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          </button>
          <button type="button" class="icon-btn" title="Профиль" aria-label="Профиль">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </button>
        </div>
      </header>

      <div class="content">
        <div id="screenList">
          <h1 class="page-title" id="pageTitle">Все сделки</h1>

          <div class="actions-row">
            <button type="button" class="btn btn-primary" id="btnNew">+ Новая сделка</button>
            <button type="button" class="btn btn-secondary" id="btnImport">Импорт</button>
            <button type="button" class="btn btn-secondary" id="btnContacts">Контакты</button>
          </div>

          <div class="stats" id="stats"></div>

          <div class="panel">
            <div class="filter-bar" id="filterBar">
              <label><input type="checkbox" id="filterInactive" /> Скрыть неактивные</label>
            </div>
            <div class="toolbar">
              <select id="pageSize" title="Строк на странице">
                <option value="10">10 / стр.</option>
                <option value="25" selected>25 / стр.</option>
                <option value="50">50 / стр.</option>
              </select>
              <button type="button" class="btn btn-secondary" id="btnExport">Экспорт</button>
              <button type="button" class="btn btn-secondary" id="btnBulk">Массовые действия ▾</button>
              <div class="toolbar-spacer"></div>
              <div class="toolbar-search">
                <input type="search" id="tableSearch" placeholder="Фильтр таблицы…" autocomplete="off" />
              </div>
              <button type="button" class="btn btn-secondary" id="btnRefresh" title="Обновить">↻</button>
            </div>

            <div class="table-wrap table-wrap--desktop">
              <table class="data-table" id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>

            <div class="mobile-cards" id="mobileCards"></div>

            <div class="table-footer">
              <span id="rangeInfo">—</span>
              <div class="pagination" id="pagination"></div>
            </div>
          </div>
        </div>

        <div id="screenDetail" style="display:none">
          <div class="deal-breadcrumb">
            <button type="button" class="btn btn-secondary" id="btnBackList">← К списку сделок</button>
            <span class="deal-title" id="dealDetailHeading">Сделка</span>
          </div>
          <div id="dealDetailRoot"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle">Запись</h3>
        <button type="button" class="modal-close" id="modalClose" aria-label="Закрыть">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot">
        <button type="button" class="btn btn-secondary" id="modalCancel">Закрыть</button>
        <button type="button" class="btn btn-primary" id="modalSave" style="display:none">Сохранить</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileUpload" multiple style="display:none" />

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <!-- SVG для кнопок действий (один раз) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-eye" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.41l-2.34-2.34a1.003 1.003 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></symbol>
  </svg>
