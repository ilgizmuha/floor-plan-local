<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Векторизация плана — локальная страница</title>
	<style>
		* { box-sizing: border-box; }
		body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 24px; background: #f5f5f5; }
		h1 { margin: 0 0 8px; font-size: 1.5rem; }
		.sub { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
		.card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
		.card h2 { margin: 0 0 12px; font-size: 1.1rem; }
		label { display: block; margin-bottom: 8px; font-weight: 500; }
		input[type="file"] { margin-bottom: 12px; }
		button { padding: 10px 20px; background: #2271b1; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
		button:hover { background: #135e96; }
		button:disabled { opacity: 0.6; cursor: not-allowed; }
		.preview { margin-top: 12px; max-width: 100%; }
		.preview img { max-width: 100%; height: auto; display: block; border: 1px solid #ddd; border-radius: 4px; }
		.svg-wrap { margin-top: 12px; overflow: auto; border: 1px solid #ddd; border-radius: 4px; padding: 12px; background: #fafafa; min-height: 80px; }
		.svg-wrap svg { max-width: 100%; height: auto; display: block; }
		.msg { margin-top: 8px; padding: 10px; border-radius: 4px; }
		.msg.err { background: #fcf0f1; color: #b32d2e; }
		.msg.ok { background: #edfaef; color: #00a32a; }
		#status { margin-left: 8px; font-size: 14px; }
	</style>
</head>
<body>
	<h1>Векторизация плана (Vectorizer.AI)</h1>
	<p class="sub">Локальная страница без плагина — загрузите план и получите SVG.</p>

	<div class="card">
		<h2>Исходное изображение</h2>
		<label for="file">Выберите файл плана (PNG, JPG):</label>
		<input type="file" id="file" accept="image/png,image/jpeg,image/jpg">
		<div id="preview" class="preview" style="display:none;"></div>
	</div>

	<div class="card">
		<h2>Векторная копия (SVG)</h2>
		<button type="button" id="btn" disabled>Векторизовать</button>
		<span id="status"></span>
		<div id="result" class="svg-wrap"></div>
	</div>

	<script>
		var fileInput = document.getElementById('file');
		var preview = document.getElementById('preview');
		var btn = document.getElementById('btn');
		var result = document.getElementById('result');
		var status = document.getElementById('status');

		fileInput.addEventListener('change', function() {
			var f = this.files[0];
			preview.style.display = 'none';
			preview.innerHTML = '';
			result.innerHTML = '';
			status.textContent = '';
			if (!f) { btn.disabled = true; return; }
			btn.disabled = false;
			var url = URL.createObjectURL(f);
			preview.innerHTML = '<img src="' + url + '" alt="План">';
			preview.style.display = 'block';
		});

		btn.addEventListener('click', function() {
			var f = fileInput.files[0];
			if (!f) return;
			btn.disabled = true;
			status.textContent = 'Отправка…';
			result.innerHTML = '';

			var form = new FormData();
			form.append('image', f);

			fetch('api/vectorize.php', { method: 'POST', body: form })
				.then(function(r) { return r.json(); })
				.then(function(data) {
					status.textContent = '';
					if (data.error) {
						result.innerHTML = '<p class="msg err">' + escapeHtml(data.error) + '</p>';
					} else if (data.svg) {
						result.innerHTML = '<div class="svg-inner">' + data.svg + '</div>';
					} else {
						result.innerHTML = '<p class="msg err">Нет SVG в ответе.</p>';
					}
				})
				.catch(function(e) {
					status.textContent = '';
					result.innerHTML = '<p class="msg err">Ошибка запроса: ' + escapeHtml(String(e)) + '</p>';
				})
				.finally(function() { btn.disabled = false; });
		});

		function escapeHtml(s) {
			var d = document.createElement('div');
			d.textContent = s;
			return d.innerHTML;
		}
	</script>
</body>
</html>
